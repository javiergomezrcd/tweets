<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tweets Filtrados</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .tweet { margin-bottom: 20px; }
    .card { box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="container my-4">
    <h1 class="mb-4">Tweets Filtrados</h1>
    
    <form method="get" class="row g-3 mb-4">
      <div class="col-md-4">
        <input type="text" class="form-control" name="keyword" placeholder="Palabra clave" value="{{ keyword }}">
      </div>
      <div class="col-md-3">
        <input type="date" class="form-control" name="date_from" placeholder="Desde" value="{{ date_from }}">
      </div>
      <div class="col-md-3">
        <input type="date" class="form-control" name="date_to" placeholder="Hasta" value="{{ date_to }}">
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">Filtrar</button>
      </div>
    </form>
    
    <p class="mb-3">Total de tweets mostrados: <strong>{{ total }}</strong></p>
    
    {% for tweet in tweets %}
      <div class="tweet">
        <div class="card">
          <div class="card-body">
            <p class="card-text">{{ tweet.text }}</p>
            <p class="card-text"><small class="text-muted">{{ tweet.date }}</small></p>
          </div>
        </div>
      </div>
    {% else %}
      <p>No se encontraron tweets con esos criterios.</p>
    {% endfor %}
  </div>
  
  <!-- Bootstrap JS (opcional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
